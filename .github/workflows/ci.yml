name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Node tests
        run: npm test

      - name: Run type checking
        run: npm run check

      - name: Assemble portable HTML
        run: npm run assemble

      - name: Verify browser behavior
        run: npm run test:browser

      - name: Scan file portability
        run: node scripts/scan-portability.mjs
